# Colab: 8 CPU MuJoCo workers. MLP PPO is faster on CPU than CUDA
# (SB3's own guidance). Physics is CPU either way.
seed: 1
easy: true
n_envs: 8
vec_env: subproc
device: cpu
normalize: true
n_steps: 512
batch_size: 1024
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.003
vf_coef: 0.5
max_grad_norm: 1.0
net_arch: [256, 256]
total_timesteps: 1500000
verbose: 0
print_every: 10
