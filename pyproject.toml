[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quad-loco"
version = "0.1.0"
description = "CPU-friendly MuJoCo locomotion stack for a custom 12-DoF quadruped."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "quad-loco"}]
dependencies = [
    "mujoco>=3.2.3,<3.11",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
    "torch",
    "numpy",
    "pyyaml",
    "imageio",
    "imageio-ffmpeg",
    "tensorboard",
    "onnx",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
